    html, body {
      margin: 0;

    body {
      min-height: 100vh;

    #initial-loader {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: #11121d;
      color: #f5f4ff;
      font: 500 14px system-ui, sans-serif;
      letter-spacing: .04em;
      z-index: 10;
      transition: opacity .25s ease;
    }
    #initial-loader span {
      color: #9b91ff;
      margin-left: 4px;
    }
  </style>
  <script src="flutter.js" defer></script>

<body>
  <div id="initial-loader">Marimuthu<span>·</span></div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      const loader = document.getElementById('initial-loader');
      if (loader) {
        loader.style.opacity = '0';
        window.setTimeout(() => loader.remove(), 300);
      }
    });
  </script>
</body>
